[project]
name = "netdiff"
version = "0.1.0"
description = "Escanea tu red y muestra que cambio desde el ultimo escaneo"
readme = "README.md"
authors = [
    { name = "distopicx01-ops", email = "distopicx01@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosql>=15.0",
    "alembic>=1.20.0",
    "dotenv>=0.9.9",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-nmap>=0.7.1",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
netdiff = "netdiff:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
